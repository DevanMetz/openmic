[package]
name = "openmic"
version = "0.13.0"
edition = "2024"
description = "Native real-time microphone cleaner and soundboard for Windows and Linux"
license = "MIT"
repository = "https://github.com/DevanMetz/openmic"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
# Whisper speech-to-text for dictation, pure Rust like the tract runtime.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# "realtime" promotes the WASAPI stream threads to Pro Audio (MMCSS) priority.
cpal = { version = "0.18.2", features = ["realtime"] }
# Same version cpal's "realtime" feature pulls in; used for the DSP thread.
audio_thread_priority = { version = "0.35", default-features = false }
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
directories = "6.0"
# glow instead of the default wgpu renderer. eframe's own x11/wayland
# features also turn wgpu on, so the Linux target below enables those
# window backends on the glutin copy this feature already links.
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
# Inflate the Linux release archive after its signature check. rust_backend
# is miniz_oxide, already in the lockfile, so this does not need a system zlib.
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
global-hotkey = "0.8"
parking_lot = "0.12"
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Verify downloaded updates: the release checksum, and the Ed25519
# signature made by the release workflow's key.
ed25519-dalek = "2"
sha2 = "0.10"
symphonia = { version = "0.5.5", features = ["all"] }
tempfile = "3"
# Downloads the dictation model on first use (Windows' own TLS stack).
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# DeepFilterNet 3 with its tract (pure Rust) runtime and embedded model; the
# crates.io release predates the runtime, so pin the upstream commit.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# deep_filter asks for tract ^0.21.4 but does not build against later 0.21.x
# releases (breaking API changes); hold the whole family at 0.21.4.
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"

[target.'cfg(target_os = "linux")'.dependencies]
# cpal's pure-Rust PulseAudio client (also works with PipeWire's pipewire-pulse).
# default_host() prefers it and falls back to ALSA when no server is running.

# realtime-dbus makes cpal's ALSA (and the shared audio_thread_priority crate)
# ask RealtimeKit. Without that feature the call succeeds and does nothing.
cpal = { version = "0.18.2", features = ["realtime", "realtime-dbus", "pulseaudio"] }
audio_thread_priority = { version = "0.35", default-features = false, features = ["with_dbus"] }
# X11 dictation and monitor placement share this connection.
x11rb = { version = "0.13.2", default-features = false, features = ["xtest", "randr", "resource_manager"] }
xkeysym = "0.2.1"
# Reuse the Wayland client and protocol bindings already linked by winit.
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
# Enable window surfaces on both Wayland and X11.
glutin = { version = "=0.32.3", default-features = false, features = ["egl", "glx", "wayland", "x11"] }
glutin-winit = { version = "=0.5.0", default-features = false, features = ["egl", "glx", "wayland", "x11"] }
# StatusNotifierItem tray. ksni speaks D-Bus itself, so the build does not
# need GTK or libappindicator. Desktops without a StatusNotifier host fail
# at runtime and OpenMic keeps the window instead.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# Wayland global shortcuts. async-std matches rfd's ashpd; tokio cannot be
# enabled at the same time. pollster and the futures crates drive the portal
# from a worker thread (they are already in the build through rfd).
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
pollster = "0.4.0"
futures-util = "0.3.34"
futures-channel = "0.3.34"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The portal test serves GlobalShortcuts. zbus is already linked through ashpd;
# the interface macro resolves `::zbus` only when this crate depends on it.
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tray-icon = "0.25"
# Same version cpal already pulls in; used to set the default microphone
# and to keep a single running instance.
windows = { version = "0.62", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# The #[interface] macro (IPolicyConfig) expands to paths in windows-core.
windows-core = "0.62"

# OpenMic's own DSP, resampler and scope drawing unoptimised run slower than
# real time, so `cargo run` would lag. Level 1 is enough for full speed and
# keeps rebuilds quick; debug assertions stay on.
[profile.dev]
opt-level = 1

# The DeepFilterNet runtime is far too slow unoptimised for realtime audio,
# and tract's debug-only graph checks reject the DeepFilterNet 3 model.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
cc = "1"
winresource = "0.1"
