name: Release

# Push a tag like v0.6.0 to build openmic.exe and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Read CI results for the tagged commit.
  checks: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Tests run in CI (the "check" job) on every commit, and releases are
      # tagged only after it passes. Re-running them here in release mode
      # recompiled the whole dependency tree and took about 15 minutes, so
      # require CI's result for this exact commit instead (waiting for a
      # run still in progress).
      - name: Require CI to have passed on this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $query = "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/check-runs?check_name=check"
          for ($i = 0; $i -lt 60; $i++) {
            $states = @(gh api $query --jq '.check_runs[] | .conclusion // .status')
            if ($LASTEXITCODE -ne 0) { throw "could not read CI results" }
            if ($states -contains 'success') { "CI passed on $env:GITHUB_SHA"; exit 0 }
            $pending = @($states | Where-Object { $_ -in 'queued', 'in_progress', 'waiting', 'pending', 'requested' })
            if ($states.Count -gt 0 -and $pending.Count -eq 0) { throw "CI did not pass on $env:GITHUB_SHA ($($states -join ', '))" }
            if ($states.Count -eq 0 -and $i -ge 5) { throw "no CI run found for $env:GITHUB_SHA; push the commit to a branch or PR first" }
            "waiting for CI on $env:GITHUB_SHA ($($states -join ', '))"
            Start-Sleep -Seconds 30
          }
          throw "timed out waiting for CI on $env:GITHUB_SHA"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Restore the release-profile cache CI keeps on main (see ci.yml);
      # a cache saved here would only be visible to this tag.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - name: Verify release version
        shell: pwsh
        run: |
          $package = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'openmic'
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") { throw "Release tag does not match Cargo.toml" }
      - name: Put clang on PATH
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo build --locked --release
      # The in-app updater looks for exactly these asset names (src/update.rs).
      - name: Name the binary after the tag
        shell: pwsh
        run: |
          $asset = "openmic-$env:GITHUB_REF_NAME-windows-x64.exe"
          Copy-Item target\release\openmic.exe $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$asset.sha256" -Encoding ascii
      # The updater refuses releases without a valid signature by this key
      # (public half in src/update.rs), so a missing secret fails the release.
      - name: Sign the binary for the in-app updater
        shell: pwsh
        env:
          OPENMIC_SIGNING_KEY: ${{ secrets.OPENMIC_SIGNING_KEY }}
        run: |
          python -m pip install --quiet cryptography
          python scripts/sign_release.py "openmic-$env:GITHUB_REF_NAME-windows-x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            openmic-${{ github.ref_name }}-windows-x64.exe
            openmic-${{ github.ref_name }}-windows-x64.exe.sha256
            openmic-${{ github.ref_name }}-windows-x64.exe.sig
          body_path: docs/releases/${{ github.ref_name }}.md

  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Require Linux CI to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=linux"
          for i in $(seq 1 60); do
            states=$(gh api "$query" --jq '.check_runs[] | .conclusion // .status')
            if printf '%s\n' "$states" | grep -qx 'success'; then
              echo "Linux CI passed on $GITHUB_SHA"
              exit 0
            fi
            if [ -n "$states" ] && ! printf '%s\n' "$states" | grep -Eq 'queued|in_progress|waiting|pending|requested'; then
              echo "Linux CI did not pass on $GITHUB_SHA ($states)" >&2
              exit 1
            fi
            echo "waiting for Linux CI on $GITHUB_SHA ($states)"
            sleep 30
          done
          echo "timed out waiting for Linux CI on $GITHUB_SHA" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
          save-if: false
      - name: Verify release version
        run: |
          package=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c \
            "import json, sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'openmic'))")
          if [ "$GITHUB_REF_NAME" != "v$package" ]; then
            echo "Release tag does not match Cargo.toml" >&2
            exit 1
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libasound2-dev libdbus-1-dev libxdo-dev libx11-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libssl-dev
      - run: cargo build --locked --release
      - name: Package the Linux build
        run: |
          name="openmic-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/openmic "$name/"
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      # The updater refuses a Linux archive without this signature (public
      # half in src/update.rs), so a missing secret fails the release.
      - name: Sign the archive for the in-app updater
        env:
          OPENMIC_SIGNING_KEY: ${{ secrets.OPENMIC_SIGNING_KEY }}
        run: |
          python3 -m pip install --quiet cryptography
          python3 scripts/sign_release.py "openmic-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            openmic-${{ github.ref_name }}-linux-x86_64.tar.gz
            openmic-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
            openmic-${{ github.ref_name }}-linux-x86_64.tar.gz.sig
          body_path: docs/releases/${{ github.ref_name }}.md
